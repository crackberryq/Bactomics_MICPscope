name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install . snakemake==9.6.2
      - run: python -m unittest discover -s tests -v
      - run: snakemake -s MICPscope.smk --cores 1 --dry-run
      - run: snakemake -s MICPscope.smk --cores 1
      - run: snakemake -s MICPscope.smk --cores 1 --dry-run
      - name: Verify packaged catalog
        working-directory: /tmp
        run: python -c "from micpscope.knowledge import load_catalog; catalog, digest = load_catalog(); assert len(catalog['entries']) >= 20"
  browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.64.1-noble
      options: --ipc=host --init
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . 'playwright==1.64.1'
      - run: python tests/browser_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: micpscope-report-previews
          path: ui-previews/*.png
  publish:
    needs: [test, browser]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Publish named, tested source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          tag="micpscope-v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
            test "$(git rev-list -n 1 "$tag")" = "$GITHUB_SHA"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "MICP Scope ${version}" --prerelease --notes-file docs/release-notes.md src/micpscope/data/micp_catalog.json
          fi
