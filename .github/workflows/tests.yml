name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install . snakemake==9.6.2
      - run: python -m unittest discover -s tests -v
      - run: snakemake -s MICPscope.smk --cores 1 --dry-run
      - run: snakemake -s MICPscope.smk --cores 1
      - run: snakemake -s MICPscope.smk --cores 1 --dry-run
